<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Blood Donation System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="login-box">
        <h2>🩸 Blood Donation</h2>
        <p class="tagline">Please login to access the system</p>

        <!-- Login Form -->
        <form action="/login" method="POST">
            <label>Email or Full Name:</label>
            <input type="text" name="email" required placeholder="Enter your registered email or name">

            <label>Password:</label>
            <input type="password" name="password" required placeholder="Enter your password">

            <button type="submit">Login</button>
        </form>

        <div class="bottom-links">
            <p>New donor? <a href="register.html">Register here</a></p>
        </div>
    </div>

</body>
</html>
