<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Blood Donation System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="login-box">
        <h2>🩸 Blood Donation</h2>
        <p class="tagline">Donor Login</p>

        <!-- Login Form -->
        <form action="/login" method="POST">
            <label>Email or Name:</label>
            <input type="text" name="email" required placeholder="Enter registered email or name">

            <label>Password:</label>
            <input type="password" name="password" required placeholder="Enter your password">

            <button type="submit">Login</button>
        </form>

        <div class="bottom-links">
            <p>New user? <a href="register.html">Register here</a></p>
            <p><a href="home.html" style="color: #666; font-size: 13px;">View Home Page as Guest &rarr;</a></p>
        </div>
    </div>

</body>
</html>
