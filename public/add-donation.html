<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Blood Donation - Blood Donation System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container" style="width: 450px;">
        <h2>Record Blood Donation</h2>
        <p style="text-align: center; color: #666; font-size: 13px; margin-top: -5px; margin-bottom: 20px;">
            Save donation record directly to MongoDB Cloud
        </p>

        <form id="donationForm" onsubmit="submitDonation(event)">
            <label>Donor Name</label>
            <input type="text" id="donorName" required placeholder="e.g. Nivedya or John Doe">

            <label>Blood Group</label>
            <select id="bloodGroup" required>
                <option value="">Select Blood Group</option>
                <option value="A+">A+</option>
                <option value="A-">A-</option>
                <option value="B+">B+</option>
                <option value="B-">B-</option>
                <option value="O+">O+</option>
                <option value="O-">O-</option>
                <option value="AB+">AB+</option>
                <option value="AB-">AB-</option>
            </select>

            <label>Units of Blood (Bags)</label>
            <input type="number" id="units" min="1" max="5" value="1" required>

            <label>Hospital / Donation Camp</label>
            <input type="text" id="hospitalOrCamp" required placeholder="e.g. City Blood Bank or Red Cross Camp">

            <label>City / Location</label>
            <input type="text" id="city" required placeholder="e.g. Mumbai, Bengaluru">

            <label>Status</label>
            <select id="status">
                <option value="Completed">Completed</option>
                <option value="Scheduled">Scheduled</option>
                <option value="Pending">Pending</option>
            </select>

            <button type="submit" id="btnSubmit" style="margin-top: 15px;">Save Blood Donation</button>
        </form>

        <div id="msg" style="display: none; padding: 10px; margin-top: 15px; border-radius: 6px; text-align: center; font-weight: bold;"></div>

        <div style="display: flex; justify-content: space-between; margin-top: 20px; border-top: 1px solid #eee; padding-top: 10px;">
            <a href="dashboard.html">← Back to Dashboard</a>
            <a href="register.html">Register Donor</a>
        </div>
    </div>

    <script>
        async function submitDonation(e) {
            e.preventDefault();
            const btn = document.getElementById('btnSubmit');
            const msg = document.getElementById('msg');
            btn.disabled = true;
            btn.textContent = 'Saving to MongoDB...';

            const payload = {
                donorName: document.getElementById('donorName').value.trim(),
                bloodGroup: document.getElementById('bloodGroup').value,
                units: document.getElementById('units').value,
                hospitalOrCamp: document.getElementById('hospitalOrCamp').value.trim(),
                city: document.getElementById('city').value.trim(),
                status: document.getElementById('status').value
            };

            try {
                const res = await fetch('/api/donations', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (data.success) {
                    msg.style.display = 'block';
                    msg.style.background = '#e8f5e9';
                    msg.style.color = '#2e7d32';
                    msg.textContent = 'Blood donation record saved to MongoDB Cloud!';
                    document.getElementById('donationForm').reset();
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1200);
                } else {
                    throw new Error(data.error || 'Failed to save');
                }
            } catch (err) {
                msg.style.display = 'block';
                msg.style.background = '#ffebee';
                msg.style.color = '#c62828';
                msg.textContent = 'Error: ' + err.message;
            } finally {
                btn.disabled = false;
                btn.textContent = 'Save Blood Donation';
            }
        }
    </script>
</body>
</html>
