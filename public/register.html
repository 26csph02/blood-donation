<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register - Blood Donation System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="login-box" style="width: 400px;">
        <h2>🩸 Donor Registration</h2>
        <p class="tagline">Create an account to become a donor</p>

        <!-- Registration Form -->
        <form action="/register" method="POST">
            <label>Full Name:</label>
            <input type="text" name="fullName" required placeholder="e.g. Rahul Sharma">

            <label>Email Address:</label>
            <input type="email" name="email" required placeholder="e.g. rahul@example.com">

            <label>Contact Phone:</label>
            <input type="tel" name="phone" required placeholder="e.g. 9876543210">

            <label>Blood Group:</label>
            <select name="bloodGroup" required>
                <option value="">-- Select Blood Group --</option>
                <option value="A+">A+</option>
                <option value="A-">A-</option>
                <option value="B+">B+</option>
                <option value="B-">B-</option>
                <option value="O+">O+</option>
                <option value="O-">O-</option>
                <option value="AB+">AB+</option>
                <option value="AB-">AB-</option>
            </select>

            <label>City / Town:</label>
            <input type="text" name="city" required placeholder="e.g. Mumbai, Bengaluru">

            <label>Password:</label>
            <input type="password" name="password" required placeholder="Enter password">

            <button type="submit">Register</button>
        </form>

        <div class="bottom-links">
            <p>Already have an account? <a href="index.html">Login here</a></p>
        </div>
    </div>

</body>
</html>
